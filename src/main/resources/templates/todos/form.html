<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Task Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <h1 th:text="${formTitle}">Task Form</h1>

    <div class="card">
        <form th:action="${formAction}" th:object="${todoRequest}" method="post">

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" th:field="*{description}" placeholder="What needs to be done?"/>
                <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="form-group">
                <label for="deadline">Deadline</label>
                <input type="date" id="deadline" th:field="*{deadline}"/>
                <div class="field-error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-secondary" th:href="@{/todos}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
